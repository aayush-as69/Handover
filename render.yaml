# Render blueprint: a web service plus a Postgres database.
services:
  - type: web
    name: handover
    runtime: python
    autoDeploy: true      # redeploy on every push to main
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false          # you type this in the Render dashboard; never commit it
      - key: DATABASE_URL
        fromDatabase:
          name: handover-db
          property: connectionString
databases:
  - name: handover-db
    plan: free
