<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Handover{% endblock %} · Handover</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Handover</a>
  {% if user %}
  <nav>
    {% if user.role.value in ("admin", "approver") %}<a href="/review">Review queue</a>{% endif %}
  </nav>
  <form method="post" action="/logout" class="who">
    <span>{{ user.display_name }} · {{ user.role.value }}</span>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="link">Sign out</button>
  </form>
  {% endif %}
</header>
<main>
{% if flash %}<p class="flash" role="status">{{ flash }}</p>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
