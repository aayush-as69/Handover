name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: handover_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Tests on SQLite
        run: python -m pytest -q
      - name: Tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/handover_test
        run: python -m pytest -q
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.lock
